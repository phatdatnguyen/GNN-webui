[pytest]
testpaths = tests
# tests/ is on sys.path so the test modules can import conftest helpers directly,
# and the repo root is there so they can import utils/models/datasets/the tab modules.
pythonpath = . tests
addopts = -ra --strict-markers --timeout=900
markers =
    slow: needs 3D conformer generation; deselect with -m "not slow"
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
